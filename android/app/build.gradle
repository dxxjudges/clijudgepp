plugins {
    id 'com.android.application'
}

// 版本号可由 CI 传入（tag 发版时联动），本地默认为 1.0 / 1
def appVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'org.dxxjudges.clijudgepp'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'org.dxxjudges.clijudgepp'
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        externalNativeBuild {
            cmake {
                // 复用仓库根目录 CMakeLists.txt（桌面与 Android 同一套源码）
                arguments '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}
